<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBite - Restaurant Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Side: Restaurant Image (Bigger & Clean) -->
        <div class="md:w-1/2 bg-gradient-to-br from-slate-950 to-slate-900 p-8 flex flex-col justify-between relative border-r border-slate-800">
            <div>
                <a href="/" class="flex items-center space-x-3 text-orange-500 font-bold text-xl">
                    <i class="fa-solid fa-store"></i>
                    <span>VoiceBite Partner</span>
                </a>
            </div>
            
            <div class="my-auto flex items-center justify-center py-4">
                <img src="/static/images/restaurant.png" alt="Restaurant Illustration" class="max-h-96 w-auto object-contain drop-shadow-2xl rounded-2xl">
            </div>

            <div></div>
        </div>

        <!-- Right Side: Signup Form -->
        <div class="md:w-1/2 p-10 flex flex-col justify-center">
            <h3 class="text-xl font-bold mb-6">Restaurant Owner Signup</h3>
            <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-xl"></div>
            
            <form id="rest-signup-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Manager / Owner Email</label>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-600/30 transition">Register Restaurant</button>
            </form>
            
            <p class="text-xs text-slate-400 text-center mt-6">Already registered? <a href="/restaurant/login" class="text-orange-400 font-semibold hover:underline">Login here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('rest-signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/restaurant/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(data.success) {
                window.location.href = data.redirect;
            } else {
                const errBox = document.getElementById('error-msg');
                errBox.innerText = data.error;
                errBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
