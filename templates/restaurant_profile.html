<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBite - Restaurant Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto bg-orange-600/15 text-orange-500 rounded-2xl flex items-center justify-center text-2xl mb-3 border border-orange-500/20">
                <i class="fa-solid fa-store"></i>
            </div>
            <h2 class="text-2xl font-bold">Restaurant Onboarding</h2>
            <p class="text-slate-400 text-xs mt-1">Setup your store name and payment UPI details.</p>
        </div>

        <form id="rest-profile-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Restaurant Name</label>
                <input type="text" id="restaurant_name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Contact Phone</label>
                <input type="tel" id="phone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">UPI ID (for payments)</label>
                <input type="text" id="upi_id" placeholder="restaurant@oksbi" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Upload UPI QR Code Image</label>
                <input type="file" id="upi_qr" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-orange-600 file:text-white hover:file:bg-orange-700">
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-600/30 transition">Save & Go to Dashboard</button>
        </form>
    </div>

    <script>
        async function loadRestProfile() {
            try {
                const res = await fetch('/api/restaurant/profile');
                const data = await res.json();
                if(data) {
                    document.getElementById('restaurant_name').value = data.restaurant_name || '';
                    document.getElementById('phone').value = data.phone || '';
                    document.getElementById('upi_id').value = data.upi_id || '';
                }
            } catch(e) {
                console.error("Error loading profile", e);
            }
        }
        loadRestProfile();

        document.getElementById('rest-profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('restaurant_name', document.getElementById('restaurant_name').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('upi_id', document.getElementById('upi_id').value);
            const qrFile = document.getElementById('upi_qr').files[0];
            if(qrFile) formData.append('upi_qr', qrFile);

            const res = await fetch('/api/restaurant/profile', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if(data.success) {
                window.location.href = '/restaurant/dashboard';
            }
        });
    </script>
</body>
</html>
