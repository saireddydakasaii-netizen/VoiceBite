<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBite - User Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto bg-red-600/10 text-red-500 rounded-2xl flex items-center justify-center text-2xl mb-3 border border-red-500/20">
                <i class="fa-solid fa-user-pen"></i>
            </div>
            <h2 class="text-2xl font-bold">Complete Your Profile</h2>
            <p class="text-slate-400 text-xs mt-1">Provide your delivery details for seamless ordering.</p>
        </div>

        <div id="status-msg" class="hidden mb-4 p-3 rounded-xl text-xs"></div>

        <form id="profile-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" id="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Phone Number</label>
                <input type="tel" id="phone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Delivery Address</label>
                <textarea id="address" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 transition"></textarea>
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-red-600/30 transition">Save Profile & Continue</button>
        </form>
    </div>

    <script>
        async function loadProfile() {
            const res = await fetch('/api/user/profile');
            const data = await res.json();
            if(data) {
                document.getElementById('name').value = data.name || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('address').value = data.address || '';
            }
        }
        loadProfile();

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            const res = await fetch('/api/user/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone, address })
            });
            const data = await res.json();
            const msgBox = document.getElementById('status-msg');
            msgBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400');
            msgBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
            msgBox.innerText = data.message;
            setTimeout(() => window.location.href = '/home', 1200);
        });
    </script>
</body>
</html>
