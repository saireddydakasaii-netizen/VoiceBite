<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBite - Restaurant Manager Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <a href="/restaurant/dashboard" class="flex items-center space-x-3 text-orange-500 font-bold text-xl">
            <i class="fa-solid fa-store"></i>
            <span>VoiceBite Manager</span>
        </a>
    
        <div class="flex items-center space-x-4">
            <a href="/restaurant/profile" class="text-xs sm:text-sm font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl border border-slate-700 transition flex items-center space-x-2">
                <i class="fa-solid fa-store text-orange-400"></i>
                <span>Store Profile</span>
            </a>
            <a href="/logout" class="text-xs sm:text-sm font-semibold text-slate-400 hover:text-white transition">Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-10 flex-grow">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10">
            <div>
                <h1 class="text-3xl font-extrabold">Restaurant Dashboard</h1>
                <p class="text-slate-400 text-sm mt-1">Manage your menu items, pricing, and daily available stock.</p>
            </div>
            <div class="mt-4 md:mt-0 bg-orange-500/10 border border-orange-500/20 text-orange-400 px-4 py-2 rounded-xl text-xs font-semibold">
                <i class="fa-solid fa-clock-rotate-left mr-1"></i> 24hr Stock Management Active
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Add Food Item Form -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl h-fit">
                <h2 class="text-xl font-bold mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-plus-circle text-orange-500"></i>
                    <span>Add Food Item</span>
                </h2>
                
                <form id="food-form" class="space-y-4" enctype="multipart/form-data">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Food Item Name</label>
                        <input type="text" id="name" required placeholder="e.g., Chicken Dum Biryani" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Stock Quantity</label>
                            <input type="number" id="quantity" required placeholder="e.g., 50" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Price (₹)</label>
                            <input type="number" step="0.01" id="price" required placeholder="e.g., 299" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Food Picture</label>
                        <input type="file" id="image" accept="image/*" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-orange-500 transition">
                    </div>
                    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-600/30 transition">
                        Add to Menu
                    </button>
                </form>
            </div>

            <!-- Right Column: Current Inventory List -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4 flex items-center space-x-2">
                    <i class="fa-solid fa-utensils text-orange-500"></i>
                    <span>Live Menu Stock Overview</span>
                </h2>

                <div id="menu-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="text-slate-500 text-sm py-8 text-center col-span-2">Loading menu items...</div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-slate-500 text-xs">
        <p>&copy; 2026 VoiceBite Partner Portal. All rights reserved.</p>
    </footer>

    <script>
        async function fetchMenu() {
            try {
                const res = await fetch('/api/restaurant/dashboard/items');
                const items = await res.json();
                const container = document.getElementById('menu-list');

                if(!items || items.length === 0) {
                    container.innerHTML = `<div class="text-slate-500 text-sm py-8 text-center col-span-2">No food items added yet. Use the form on the left to add your items!</div>`;
                    return;
                }

                container.innerHTML = items.map(item => `
                    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center space-x-4">
                        <img src="/static/uploads/${item.image}" class="w-20 h-20 object-cover rounded-xl border border-slate-800">
                        <div class="flex-grow">
                            <h4 class="font-bold text-slate-100 text-sm">${item.name}</h4>
                            <p class="text-xs text-orange-400 font-semibold mt-1">₹${item.price}</p>
                            <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-boxes-stacked mr-1"></i> Stock Available: <span class="text-slate-200 font-bold">${item.quantity}</span></p>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                console.error("Error loading items", e);
            }
        }

        document.getElementById('food-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('quantity', document.getElementById('quantity').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('image', document.getElementById('image').files[0]);

            const res = await fetch('/api/restaurant/food', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('food-form').reset();
                fetchMenu();
            }
        });

        fetchMenu();
    </script>
</body>
</html>
