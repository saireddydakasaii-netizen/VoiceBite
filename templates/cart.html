<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBite - Cart & Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <nav class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <a href="/home" class="flex items-center space-x-3 text-red-500 font-bold text-xl">
            <i class="fa-solid fa-microphone-lines"></i>
            <span>VoiceBite</span>
        </a>
        <a href="/home" class="text-slate-400 hover:text-white text-sm font-semibold">Back to Home</a>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-6 py-10 flex-grow max-w-4xl">
        <h1 class="text-3xl font-extrabold mb-6">Your Order Cart</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Left: Cart Items -->
            <div class="md:col-span-2 space-y-4" id="cart-items-container">
                <div class="text-slate-500 text-sm py-8 text-center bg-slate-900 border border-slate-800 rounded-3xl">Your cart is empty.</div>
            </div>

            <!-- Right: Checkout & Payment -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl h-fit">
                <h2 class="text-xl font-bold mb-4">Payment & Checkout</h2>
                
                <div class="space-y-4 mb-6">
                    <div class="flex justify-between text-sm text-slate-400">
                        <span>Total Items</span>
                        <span id="total-count" class="font-bold text-slate-200">0</span>
                    </div>
                    <div class="flex justify-between text-base font-bold text-slate-100 border-t border-slate-800 pt-3">
                        <span>Total Amount</span>
                        <span id="total-amount" class="text-red-400">₹0.00</span>
                    </div>
                </div>

                <div class="space-y-3 mb-6">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Select Payment Method</label>
                    <div class="flex space-x-4">
                        <label class="flex items-center space-x-2 text-sm cursor-pointer">
                            <input type="radio" name="payment" value="COD" checked onclick="togglePayment('cod')" class="text-red-600">
                            <span>Cash on Delivery</span>
                        </label>
                        <label class="flex items-center space-x-2 text-sm cursor-pointer">
                            <input type="radio" name="payment" value="Online" onclick="togglePayment('online')" class="text-red-600">
                            <span>Online UPI / QR</span>
                        </label>
                    </div>
                </div>

                <!-- Online QR Section (Hidden by default) -->
                <div id="qr-section" class="hidden mb-6 p-4 bg-slate-950 border border-slate-800 rounded-2xl text-center">
                    <p class="text-xs text-slate-400 mb-2">Scan QR or pay via UPI ID</p>
                    <div id="qr-display" class="w-36 h-36 mx-auto bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-center mb-2 overflow-hidden">
                        <i class="fa-solid fa-qrcode text-4xl text-slate-600"></i>
                    </div>
                    <span id="upi-display" class="text-xs font-semibold text-red-400">UPI ID: loading...</span>
                </div>

                <button onclick="placeOrder()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-red-600/30 transition">
                    Confirm & Pay Order
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-900 py-6 text-center text-slate-500 text-xs">
        <p>&copy; 2026 VoiceBite. All rights reserved.</p>
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-slate-500 text-sm py-8 text-center bg-slate-900 border border-slate-800 rounded-3xl">Your cart is empty.</div>`;
                document.getElementById('total-count').innerText = '0';
                document.getElementById('total-amount').innerText = '₹0.00';
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-xl">
                    <div>
                        <h4 class="font-bold text-slate-100 text-base">${item.name}</h4>
                        <p class="text-xs text-slate-400 mt-1">Qty: ${item.quantity} x ₹${item.price}</p>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="font-bold text-red-400 text-sm">₹${item.price * item.quantity}</span>
                        <button onclick="removeItem(${index})" class="text-slate-500 hover:text-red-400 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            const totalQty = cart.reduce((sum, i) => sum + i.quantity, 0);
            const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            document.getElementById('total-count').innerText = totalQty;
            document.getElementById('total-amount').innerText = `₹${totalPrice.toFixed(2)}`;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function togglePayment(type) {
            const qrSection = document.getElementById('qr-section');
            if (type === 'online') {
                qrSection.classList.remove('hidden');
                fetchRestaurantDetails();
            } else {
                qrSection.classList.add('hidden');
            }
        }

        async function fetchRestaurantDetails() {
            if (cart.length === 0) return;
            const restId = cart[0].restaurant_id;
            const res = await fetch('/api/restaurants');
            const restaurants = await res.json();
            const rest = restaurants.find(r => r.id === restId);
            if (rest) {
                document.getElementById('upi-display').innerText = `UPI: ${rest.upi_id || 'voicebite@upi'}`;
                if (rest.qr_image) {
                    document.getElementById('qr-display').innerHTML = `<img src="/static/uploads/${rest.qr_image}" class="w-full h-full object-cover">`;
                }
            }
        }

        async function placeOrder() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            const restaurantId = cart[0].restaurant_id;
            const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);

            const res = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    restaurant_id: restaurantId,
                    items: cart,
                    total_amount: totalAmount,
                    payment_method: paymentMethod
                })
            });

            const data = await res.json();
            if (data.success) {
                localStorage.removeItem('cart');
                window.location.href = `/track/${data.order_id}`;
            } else {
                alert('Error placing order. Please try again.');
            }
        }

        renderCart();
    </script>
</body>
</html>
