<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBite - Restaurant Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-8">
        <div class="text-center mb-6">
            <div class="w-16 h-16 mx-auto bg-orange-600/10 text-orange-500 rounded-2xl flex items-center justify-center text-2xl mb-3 border border-orange-500/20">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2 class="text-2xl font-bold">Restaurant Password Reset</h2>
            <p class="text-slate-400 text-xs mt-1">Enter your registered manager email to set a new password.</p>
        </div>

        <div id="status-msg" class="hidden mb-4 p-3 rounded-xl text-xs"></div>

        <form id="rest-reset-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Manager Email</label>
                <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">New Password</label>
                <input type="password" id="new_password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500 transition">
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-orange-600/30 transition">Reset Password</button>
        </form>

        <p class="text-xs text-slate-400 text-center mt-6">Remembered password? <a href="/restaurant/login" class="text-orange-400 font-semibold hover:underline">Back to Login</a></p>
    </div>

    <script>
        document.getElementById('rest-reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const new_password = document.getElementById('new_password').value;

            const res = await fetch('/api/restaurant/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, new_password })
            });
            const data = await res.json();
            const msgBox = document.getElementById('status-msg');
            msgBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'bg-emerald-500/10', 'text-emerald-400');

            if(data.success) {
                msgBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
                msgBox.innerText = data.message;
                setTimeout(() => window.location.href = '/restaurant/login', 1500);
            } else {
                msgBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
                msgBox.innerText = data.error;
            }
        });
    </script>
</body>
</html>
