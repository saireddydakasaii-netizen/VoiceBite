<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceBite - User Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- Left Side: Toy Illustration & Branding -->
        <div class="md:w-1/2 bg-gradient-to-br from-slate-950 to-slate-900 p-10 flex flex-col justify-between relative border-r border-slate-800">
            <div>
                <a href="/" class="flex items-center space-x-3 text-red-500 font-bold text-xl">
                    <i class="fa-solid fa-microphone-lines"></i>
                    <span>VoiceBite</span>
                </a>
            </div>
            <div class="my-10 text-center">
                <div class="w-48 h-48 mx-auto bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-center relative shadow-inner overflow-hidden mb-6">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-50">
                    <div class="z-10 p-4 bg-red-600 text-white rounded-full shadow-lg">
                        <i class="fa-solid fa-user-plus text-3xl"></i>
                    </div>
                </div>
                <h2 class="text-2xl font-bold">Create Your Account</h2>
                <p class="text-slate-400 text-sm mt-2">Join the voice revolution in food delivery.</p>
            </div>
            <div class="text-xs text-slate-500 text-center">Zomato & Swiggy style voice automation</div>
        </div>

        <!-- Right Side: Signup Form -->
        <div class="md:w-1/2 p-10 flex flex-col justify-center">
            <h3 class="text-xl font-bold mb-6">User Sign Up</h3>
            <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-xl"></div>
            
            <form id="signup-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-red-500 transition">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-red-600/30 transition">Sign Up Now</button>
            </form>
            
            <p class="text-xs text-slate-400 text-center mt-6">Already have an account? <a href="/login" class="text-red-400 font-semibold hover:underline">Login here</a></p>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(data.success) {
                window.location.href = data.redirect;
            } else {
                const errBox = document.getElementById('error-msg');
                errBox.innerText = data.error;
                errBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
